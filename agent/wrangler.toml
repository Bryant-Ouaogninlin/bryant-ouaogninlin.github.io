name = "kineo-agent"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Réglages non secrets (modifiables ici ou dans le tableau de bord Cloudflare)
[vars]
MODEL = "claude-opus-5-5"   # voir README : "claude-sonnet-5-5" est environ 2 fois moins cher
EFFORT = "medium"           # low | medium | high : plus c'est bas, plus c'est rapide et peu coûteux

# Mémoire de l'agent (conversations, demandes, projets). À créer : voir README, étape 3.
[[kv_namespaces]]
binding = "KV"
id = "9f76db02413741f0a0b48d2b9c4b2a50"

# Secrets à ajouter dans Cloudflare (jamais dans ce fichier) :
#   ANTHROPIC_API_KEY, WHATSAPP_TOKEN, WHATSAPP_PHONE_ID,
#   WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET, OWNER_NUMBER,
#   MM_WAVE, MM_ORANGE, MM_MTN, MM_MOOV, MM_HOLDER, BANK_NAME, BANK_HOLDER, BANK_RIB   (paiement manuel, voir README)
#   CINETPAY_API_KEY, CINETPAY_SITE_ID   (plus tard, si vous ouvrez un compte CinetPay)
# Optionnels (messages proactifs hors fenêtre de 24 h) :
#   TEMPLATE_OWNER_ALERT, TEMPLATE_PROJECT_UPDATE, TEMPLATE_PAYMENT_LINK, TEMPLATE_PAYMENT_OK
